<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#fffdf9">
{% seo %}
<link rel="icon" href="{{ site.blog.avatar | relative_url }}">
<link rel="alternate" type="application/atom+xml" title="HEYWEEN" href="{{ '/feed.xml' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/css/blog.css' | relative_url }}?v={{ site.time | date: '%s' }}">
{% if page.layout == 'home' %}<link rel="preload" as="image" href="{{ site.blog.background | relative_url }}">{% endif %}
<script defer src="{{ '/assets/vendor/animejs/anime.umd.min.js' | relative_url }}"></script>
<script defer src="{{ '/assets/js/blog.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
{% if page.math %}
<script src="{{ '/assets/js/data/mathjax.js' | relative_url }}"></script>
<script defer id="MathJax-script" src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-chtml.js"></script>
{% endif %}
